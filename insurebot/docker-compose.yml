# InsureBot local lab (Step 00).
# Postgres, Keycloak, Mailpit and Jaeger are started now but used from later steps:
#   Keycloak → step 02, Postgres → step 06, Mailpit → step 07, Jaeger → step 09.
# Dev-only passwords. Never reuse them outside this laptop.
# Every image is pinned to a version AND a digest (step 11): what runs can't change under you.
# Dependabot opens a pull request when a newer version exists.

services:
  redis:
    image: redis:7.4.11@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
    ports: ["127.0.0.1:6381:6379"] # 6381 on the Mac: 6379 and 6380 are used by other local projects
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_PASSWORD: devonly # superuser: for migrations only, never used by the app
      POSTGRES_DB: insurebot
      INSUREBOT_APP_PASSWORD: ${INSUREBOT_APP_PASSWORD:?set INSUREBOT_APP_PASSWORD in .env} # read by db/001_roles.sh
      LAB_VIEWER_PASSWORD: ${LAB_VIEWER_PASSWORD:?set LAB_VIEWER_PASSWORD in .env} # read by db/005_lab_viewer.sh
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.8@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    # --import-realm loads keycloak/insurebot-realm.json on first start (once you've exported it)
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # One fixed public name, so "iss" is the same whether a token is fetched
      # from the Mac (localhost:8080) or checked from a pod (keycloak:8080)
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - kcdata:/opt/keycloak/data # keeps your realm when the container is recreated
      - ./keycloak:/opt/keycloak/data/import:ro
    ports: ["127.0.0.1:8080:8080"]

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

  jaeger:
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4318:4318"]

  insurebot:
    build: .
    deploy:
      replicas: 3 # three pods behind one gateway: proves the server is stateless
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ALLOWED_HOSTS: localhost,127.0.0.1,gateway # "gateway": the lab UI calls through the gateway inside Docker
      REDIS_URL: redis://redis:6379
      QUOTE_TTL_SECONDS: 1800
      LEGACY_MODE: stateless # set to "reject" to refuse 2025-era clients
      OIDC_ISSUER: http://localhost:8080/realms/insurebot # what tokens say in "iss"
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/insurebot # how pods reach Keycloak
      RESOURCE_URL: http://localhost:3000/mcp # InsureBot's identity: must be in the token's "aud"
      PAYCO_URL: http://payco:4000
      # Secrets come from .env (git-ignored), never written in this file
      PAYCO_API_KEY: ${PAYCO_API_KEY:?set PAYCO_API_KEY in .env}
      REQUEST_STATE_KEY: ${REQUEST_STATE_KEY:?set REQUEST_STATE_KEY in .env}
      # Connects as insurebot_app: not the owner, not a superuser, so RLS always applies
      DATABASE_URL: postgres://insurebot_app:${INSUREBOT_APP_PASSWORD}@postgres:5432/insurebot
      SMTP_URL: smtp://mailpit:1025 # every email lands in Mailpit, http://localhost:8025
      RATE_LIMIT_PER_MINUTE: 600 # requests per agency per minute (LLM10)
      # Step 09: traces go to Jaeger, http://localhost:16686
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: insurebot
      OTEL_BSP_SCHEDULE_DELAY: 500 # send spans every 0.5 s (lab: see them quickly)
      # Step 10: every tool call is checked by the PDP; if it's down, everything is denied
      PDP_URL: http://pdp:8181
      PDP_API_KEY: ${PDP_API_KEY:?set PDP_API_KEY in .env}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pdp:
        condition: service_healthy

  pdp:
    # Step 10: Policy Decision Point. Same image as InsureBot, different program.
    build: .
    command: ["node", "dist/pdp/server.js"]
    environment:
      PDP_PORT: 8181
      POLICY_DIR: /policy
      PDP_API_KEY: ${PDP_API_KEY:?set PDP_API_KEY in .env}
    volumes: ["./policy:/policy:ro"] # edit policy/*.cedar on the Mac: reloaded within 2 s
    ports: ["127.0.0.1:8181:8181"] # exposed so tests can check policies directly
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8181/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 10

  payco:
    # Mock payment provider (step 04). Plain Node, no build step.
    image: node:26.9.0-slim@sha256:3a771f83944bb763050c23c0225c260638c4b7899e7a72485ef75e5e570499e5
    command: ["node", "/app/server.mjs"]
    user: node
    volumes: ["./payco:/app:ro"]
    environment:
      PAYCO_API_KEY: ${PAYCO_API_KEY:?set PAYCO_API_KEY in .env}
    ports: ["127.0.0.1:4000:4000"] # exposed so tests can count the charges

  ui:
    # Lab UI: http://localhost:3005. Another MCP client, through the same gateway as everyone else.
    build:
      context: .
      dockerfile: ui/Dockerfile
    env_file: .env.test # test-account passwords, used only by the Attack lab's actors
    environment:
      UI_PUBLIC_URL: http://localhost:3005
      OIDC_ISSUER: http://localhost:8080/realms/insurebot
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/insurebot
      UI_OIDC_CLIENT_ID: insurebot-ui
      UI_OIDC_CLIENT_SECRET: ${UI_OIDC_CLIENT_SECRET:?set UI_OIDC_CLIENT_SECRET in .env}
      RESOURCE_URL: http://localhost:3000/mcp
      LAB_AUDIT_DATABASE_URL: postgres://insurebot_lab_viewer:${LAB_VIEWER_PASSWORD}@postgres:5432/insurebot
      PDP_URL: http://pdp:8181
      PDP_API_KEY: ${PDP_API_KEY:?set PDP_API_KEY in .env}
      MAILPIT_URL: http://mailpit:8025
    volumes: ["./policy:/policy"] # the Policies tab edits this file (admins only); the PDP reloads it
    ports: ["127.0.0.1:3005:3005"]
    depends_on:
      gateway:
        condition: service_started
      pdp:
        condition: service_healthy

  gateway:
    image: nginx:1.27.5@sha256:6784fb0834aa7dbbe12e3d7471e69c290df3e6ba810dc38b34ae33d3c1c05f7d
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:3000:80" # public entrance (WAF blocks admin tools)
      - "127.0.0.1:3002:81" # admin entrance
      - "127.0.0.1:3003:82" # LAB: shared cache that respects Cache-Control
      - "127.0.0.1:3004:83" # LAB: broken shared cache (ignores Cache-Control) → shows Episode 6
    depends_on:
      - insurebot

volumes:
  pgdata:
  kcdata:
