events {}

http {
  # Docker's internal DNS: re-resolve so scaled or restarted pods are picked up
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream insurebot {
    zone insurebot 64k;
    server insurebot:3000 resolve;  # every replica's IP, round-robin
  }

  log_format mcp '$server_port $remote_addr "$request" $status '
                 'method=$http_mcp_method name=$http_mcp_name upstream=$upstream_addr cache=$upstream_cache_status';
  access_log /dev/stdout mcp;

  # WAF rule (step 05): admin tools may not be called through the public entrance.
  # The gateway decides from the Mcp-Name HEADER without parsing the JSON body.
  # That's only safe because InsureBot rejects a header that disagrees with the body (-32020, Episode 7).
  map $http_mcp_name $admin_tool {
    default        0;
    agency_stats   1;
    export_report  1;
    get_report     1;
  }

  # Lab only: a shared cache, to show Episode 6
  proxy_cache_path /tmp/nginx-cache levels=1 keys_zone=mcp_lab:1m max_size=10m inactive=5m;

  # ---------- Public entrance: localhost:3000 ----------
  server {
    listen 80;

    location /mcp {
      if ($admin_tool) { return 403 '{"error":"admin tools are not available on the public entrance"}\n'; }
      proxy_pass http://insurebot;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_buffering off;          # SSE responses must stream through
      proxy_read_timeout 300s;
      add_header X-Upstream $upstream_addr always;   # which pod answered (lab only)
    }

    # OAuth discovery (RFC 9728): where clients find out how to log in
    location /.well-known/ {
      proxy_pass http://insurebot;
      proxy_set_header Host $host;
    }

    location /healthz {
      proxy_pass http://insurebot;
      proxy_set_header Host $host;
    }
  }

  # ---------- Admin entrance: localhost:3002 ----------
  # Same pods, no admin-tool block. In production this would sit on a VPN or internal network.
  server {
    listen 81;
    location /mcp {
      proxy_pass http://insurebot;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_buffering off;
    }
  }

  # ---------- LAB: shared cache that respects Cache-Control: localhost:3003 ----------
  # Caches MCP POSTs keyed only by method (NOT by user). Safe only because InsureBot
  # answers "Cache-Control: private, no-store", which nginx obeys.
  server {
    listen 82;
    location /mcp {
      proxy_pass http://insurebot;
      proxy_set_header Host $host;
      proxy_cache mcp_lab;
      proxy_cache_methods POST;
      proxy_cache_key "$server_port|$http_mcp_method|$http_x_lab_run";
      proxy_cache_valid 200 60s;
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }

  # ---------- LAB: BROKEN shared cache that ignores Cache-Control: localhost:3004 ----------
  # The classic misconfiguration (a CDN told to "cache everything"). It shows Episode 6 happening.
  server {
    listen 83;
    location /mcp {
      proxy_pass http://insurebot;
      proxy_set_header Host $host;
      proxy_cache mcp_lab;
      proxy_cache_methods POST;
      proxy_cache_key "$server_port|$http_mcp_method|$http_x_lab_run";
      proxy_cache_valid 200 60s;
      proxy_ignore_headers Cache-Control Expires Vary Set-Cookie;
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
